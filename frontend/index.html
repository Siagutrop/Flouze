<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05080f" />
    <script>
      // Applique le thème sauvegardé avant le premier rendu (anti-FOUC)
      try {
        if (localStorage.getItem('flouze-theme') === 'light')
          document.documentElement.classList.add('light');
      } catch (e) {}
    </script>
    <title>Flouze</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash : visible instantanément, retiré après le 1er rendu React -->
    <div id="splash" style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05080f;transition:opacity .4s">
      <div style="width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#2dd4bf,#34d399);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgb(45 212 191/.35);animation:splash-pulse 1.4s ease-in-out infinite">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#05080f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/></svg>
      </div>
      <p style="margin-top:18px;font-family:system-ui;font-weight:800;font-size:22px;color:#f1f5f9;letter-spacing:-.02em">Flouze</p>
      <style>@keyframes splash-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
